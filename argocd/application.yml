# Opcional: equivalente declarativo de crear la app desde la UI de Argo CD.
# Aplicar con: kubectl apply -f argocd/application.yml
# Repositorio: github.com/Romelg18/argocd-gitops-taller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Romelg18/argocd-gitops-taller.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
